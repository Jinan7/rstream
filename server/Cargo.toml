[package]
name = "actix-web-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-session = { version = "0.11.0", features = ["redis-session-native-tls"] }
actix-web = "4.18.1"
anyhow = "1.0.104"
config = "0.15.27"
reqwest = "0.13.5"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "rt"] }
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
