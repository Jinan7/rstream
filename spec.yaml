name: rstream
region: fra
services:
  - name: rstream-server
    dockerfile_path: ./server/Dockerfile
    source_dir: ./server
    github:
      branch: master
      deploy_on_push: true
      repo: Jinan7/rstream
    health_check:
      http_path: /health_check
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: APP_APPLICATION__BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: APP_DATABASE__USERNAME
        scope: RUN_TIME
        value: ${rstream.USERNAME}
      - key: APP_DATABASE__PASSWORD
        scope: RUN_TIME
        value: ${rstream.PASSWORD}
      - key: APP_DATABASE__HOST
        scope: RUN_TIME
        value: ${rstream.HOSTNAME}
      - key: APP_DATABASE__PORT
        scope: RUN_TIME
        value: ${rstream.PORT}
      - key: APP_DATABASE__DATABASE_NAME
        scope: RUN_TIME
        value: ${rstream.DATABASE}
  - name: rstream-client
    dockerfile_path: ./client/Dockerfile
    source_dir: ./client
    github:
      branch: master
      deploy_on_push: true
      repo: Jinan7/rstream
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
databases:
  - engine: PG
    name: rstream
    num_nodes: 1
    size: db-s-dev-databases
    version: "16"